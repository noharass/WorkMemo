<g transform="translate(752,8)"><rect width="240" height="174" rx="20" fill="#0f1623" stroke="#6ef3da" stroke-opacity=".25"/><circle cx="28" cy="30" r="5" fill="#6ef3da"/><text x="22" y="80" font-size="27" font-weight="600" fill="#edf9ff">Neon</text><text x="23" y="109" font-size="15" fill="#c0d3e7">赛博微光</text><path d="M23 145H72" stroke="#6ef3da" stroke-width="4" stroke-linecap="round"/><circle cx="217" cy="146" r="4" fill="#6ef3da" opacity=".4"/></g>
